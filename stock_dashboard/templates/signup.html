<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up - StockX</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>StockX</h2>
    <ul>
      <li><a href="{{ url_for('index') }}">📊 Market Analysis</a></li>
      <li><a href="{{ url_for('buy') }}">💰 Buy Stocks</a></li>
      <li><a href="{{ url_for('sell') }}">📉 Sell Holdings</a></li>
      <li><a href="{{ url_for('predict') }}">🔮 Stock Predictions</a></li>
      <li><a href="{{ url_for('holder') }}">📂 Stock Holder</a></li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <header>
      <h1>Sign Up</h1>
    </header>

    <div class="login-container">
      <form id="signupForm">
        <label for="email">Email:</label>
        <input type="email" id="email" required>

        <label for="password">Password:</label>
        <input type="password" id="password" required>

        <label for="confirmPassword">Confirm Password:</label>
        <input type="password" id="confirmPassword" required>

        <button type="submit" style="margin-top: 12px;">Sign Up</button>

        <p style="text-align: center; margin-top: 1.2rem; font-size: 0.9rem;">
          Already have an account? <a href="{{ url_for('login') }}">Log in</a>
        </p>

        <p id="signupMessage" style="color: red;"></p>
      </form>
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    const indexUrl = "{{ url_for('index') }}";

    document.getElementById('signupForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const confirmPassword = document.getElementById("confirmPassword").value.trim();
      const message = document.getElementById("signupMessage");

      const emailRegex = /^[\w-.]+@([\w-]+\.)+[\w-]{2,4}$/;
      const passwordRegex = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{6,}$/;

      if (!emailRegex.test(email)) {
        message.textContent = "Please enter a valid email address.";
        return;
      }

      if (!passwordRegex.test(password)) {
        message.textContent = "Password must be at least 6 characters long and include both letters and numbers.";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
      }

      alert('Signed up successfully!');
      localStorage.setItem("loggedIn", "true");
      window.location.href = indexUrl;
    });
  </script>
</body>
</html>
